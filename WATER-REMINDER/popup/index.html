<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydration Reminder</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    /* Specific styles for the overlay popup */
    body {
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 10px;
    }

    #popup-container {
      width: 320px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(100px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #popup-container.active {
      opacity: 1;
      transform: translateY(0);
    }

    #popup-container.closing {
      animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Anime character styling */
    .character-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: -15px; /* Pull the character closer to the text card */
      z-index: 10;
      transform-origin: bottom center;
      animation: floatAnime 4s ease-in-out infinite;
    }

    .character-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
    }

    /* Speech bubble */
    .speech-bubble {
      position: absolute;
      top: -30px;
      right: -40px;
      background: var(--bubble-bg);
      color: var(--text-dark);
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 600;
      max-width: 160px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.8);
      z-index: 20;
      opacity: 0;
      transform: scale(0.6) rotate(5deg);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
      transform-origin: bottom left;
    }

    .speech-bubble.active {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 20px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: var(--bubble-bg) transparent;
      display: block;
      width: 0;
    }

    /* Glass card container */
    .glass-card {
      width: 100%;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 5;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title span {
      color: var(--primary);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .message {
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-family: var(--font-family);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--text-dark);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3);
      animation: pulseBorder 1.5s infinite;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    /* Small decorative elements */
    .droplet-decor {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.25;
      animation: floatWater 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="popup-container">
    <div class="character-container">
      <div id="speech-bubble" class="speech-bubble">Stay hydrated!</div>
      <img src="../assets/character.png" alt="Anime Character" class="character-img" id="char-img">
    </div>
    
    <div class="glass-card glass">
      <div class="header">
        <h2 class="title">💧 Hydration <span>Reminder</span></h2>
        <button class="close-btn" id="btn-close" title="Dismiss">&times;</button>
      </div>
      
      <p class="message" id="reminder-msg">
        It's time to take a break and refresh yourself with some water!
      </p>
      
      <div class="actions">
        <button class="btn btn-primary" id="btn-drink">
          🥛 Drank 250ml
        </button>
        <button class="btn btn-secondary" id="btn-snooze">
          ⏰ Snooze 10m
        </button>
      </div>
    </div>
    
    <div class="droplet-decor" style="top: 80px; left: 10px; animation-delay: 0.5s;">💧</div>
    <div class="droplet-decor" style="top: 140px; right: 10px; animation-delay: 1.2s; font-size: 1.2rem;">💧</div>
  </div>

  <!-- Audio elements -->
  <audio id="chime-audio" src="../assets/water-chime.mp3" preload="auto"></audio>

  <script src="popup.js"></script>
</body>
</html>
