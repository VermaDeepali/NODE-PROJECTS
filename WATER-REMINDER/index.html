<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydration Companion - Dashboard</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #020617 0%, #0b1528 50%, #0f172a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      height: 100vh;
      width: 100vw;
    }

    #app-container {
      width: 100%;
      max-width: 680px;
      height: 520px;
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      position: relative;
      overflow: hidden;
    }

    /* Left Panel - Hydration Progress */
    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
    }

    .tracker-circle {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tracker-circle svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .tracker-circle circle {
      fill: none;
      stroke-width: 12;
      stroke-linecap: round;
    }

    .tracker-circle .bg-circle {
      stroke: rgba(255, 255, 255, 0.05);
    }

    .tracker-circle .progress-circle {
      stroke: url(#blueGrad);
      stroke-dasharray: 527.7; /* 2 * PI * r (r=84) */
      stroke-dashoffset: 527.7;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tracker-value {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }

    .tracker-value .current {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(to right, #38bdf8, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tracker-value .target {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }

    .status-text {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .add-water-quick {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .btn-quick {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 12px;
      font-family: var(--font-family);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-quick:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    /* Right Panel - Settings & Logs */
    .right-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      gap: 20px;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 2px;
    }

    /* Settings Rows */
    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(255, 255, 255, 0.02);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .setting-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .setting-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Form Controls */
    select, input[type="number"] {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-family: var(--font-family);
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--primary);
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Test Button */
    .btn-test {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      color: white;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-family: var(--font-family);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-test:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
    }

    .btn-test:active {
      transform: translateY(0);
    }

    /* Header styling */
    .dashboard-header {
      grid-column: 1 / span 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 15px;
      margin-bottom: 5px;
    }

    .app-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title span {
      background: linear-gradient(to right, #38bdf8, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .reset-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .reset-btn:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div id="app-container" class="glass">
    <!-- Header -->
    <div class="dashboard-header">
      <h1 class="app-title">💧 Hydration <span>Companion</span></h1>
      <button id="btn-reset" class="reset-btn">Reset Stats</button>
    </div>

    <!-- Left Panel - Progress Circle -->
    <div class="left-panel">
      <div class="tracker-circle">
        <svg>
          <defs>
            <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#2dd4bf" />
            </linearGradient>
          </defs>
          <circle class="bg-circle" cx="90" cy="90" r="84"></circle>
          <circle class="progress-circle" id="progress-circle" cx="90" cy="90" r="84"></circle>
        </svg>
        <div class="tracker-value">
          <span class="current" id="current-water">0</span>
          <span class="target">of <span id="target-water">2000</span>ml</span>
        </div>
      </div>
      
      <div class="status-text" id="status-comment">Keep it up! Let's start drinking.</div>
      
      <div class="add-water-quick">
        <button class="btn-quick" data-amount="250">🥛 +250ml</button>
        <button class="btn-quick" data-amount="500">🥤 +500ml</button>
        <button class="btn-quick" data-amount="100">💧 +100ml</button>
      </div>
    </div>

    <!-- Right Panel - Settings -->
    <div class="right-panel">
      <div class="panel-section">
        <h2 class="section-title">Configuration</h2>
        <div class="settings-group">
          <!-- Interval -->
          <div class="setting-row">
            <div>
              <div class="setting-label">Reminder Interval</div>
              <div class="setting-desc">How often should character appear</div>
            </div>
            <select id="select-interval">
              <option value="15">15 Minutes</option>
              <option value="30" selected>30 Minutes</option>
              <option value="45">45 Minutes</option>
              <option value="60">60 Minutes</option>
              <option value="120">2 Hours</option>
            </select>
          </div>
          
          <!-- Target Goal -->
          <div class="setting-row">
            <div>
              <div class="setting-label">Daily Goal</div>
              <div class="setting-desc">Target water consumption</div>
            </div>
            <input type="number" id="input-goal" value="2000" min="500" max="5000" step="100" style="width: 80px;">
          </div>

          <!-- Sound Effects -->
          <div class="setting-row">
            <div>
              <div class="setting-label">Sound Effects</div>
              <div class="setting-desc">Play audio chime on notification</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-sound" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Action Button -->
      <div>
        <button class="btn-test" id="btn-test-reminder">
          ✨ Test Reminder Now
        </button>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
